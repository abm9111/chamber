# Chamber behind nginx + certbot (or pre-issued certs)
# Install:
#   sudo cp deploy/nginx-chamber.conf /etc/nginx/sites-available/chamber
#   sudo ln -s /etc/nginx/sites-available/chamber /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d chamber.example.com
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=chamber_limit:10m rate=5r/s;

upstream chamber_backend {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 80;
    server_name chamber.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chamber.example.com;

    # certbot paths (adjust if using your own certs)
    ssl_certificate     /etc/letsencrypt/live/chamber.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chamber.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Optional: HTTP basic auth
    # auth_basic "Chamber";
    # auth_basic_user_file /etc/nginx/chamber.htpasswd;

    client_max_body_size 1m;
    limit_req zone=chamber_limit burst=20 nodelay;

    location / {
        proxy_pass http://chamber_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /health {
        proxy_pass http://chamber_backend/health;
        access_log off;
    }
}
