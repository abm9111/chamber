name: "Chamber Verify — docs drift gate"
# Marketplace caps this description at 125 characters.
description: >-
  Fail the build when the ground moves under a written claim — hash-checks
  every pinned citation. No model, no network.
author: "abm9111"
branding:
  icon: "anchor"
  color: "gray-dark"

# No npx, no npm install: the checked-out action directory IS this repository
# at the ref you pinned in `uses:`, and the package has zero runtime
# dependencies — so the action runs its own source directly. That sidesteps
# ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING entirely (current Node refuses
# to strip types under node_modules, which is where npx installs packages —
# KNOWN_LIMITATIONS entry 18) and makes the version semantics exact: the tag
# in `uses:` is the code that runs.

inputs:
  docs-path:
    description: "Directory of markdown to ingest as citable passages."
    required: false
    default: "docs"
  code-path:
    description: >-
      Directory of code to index as citable passages (TypeScript/JavaScript/
      Python). Empty skips code indexing.
    required: false
    default: ""
  database:
    description: >-
      Path to the Chamber SQLite database holding the pinned beliefs. This
      must persist across runs (commit it, or restore it from a cache) — a
      fresh database has zero beliefs and verify has nothing to check.
    required: false
    default: ".chamber/chamber.sqlite"
  node-version:
    description: "Node.js version (23.6+ — type stripping outside node_modules)."
    required: false
    default: "24"

outputs:
  report:
    description: "The full verify --json object (beliefs, pins, failure reasons)."
    value: ${{ steps.verify.outputs.report }}

runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Ingest docs
      shell: bash
      env:
        CHAMBER_DB: ${{ inputs.database }}
      run: node --experimental-strip-types "${{ github.action_path }}/src/cli.ts" ingest "${{ inputs.docs-path }}"

    - name: Index code
      if: ${{ inputs.code-path != '' }}
      shell: bash
      env:
        CHAMBER_DB: ${{ inputs.database }}
      run: node --experimental-strip-types "${{ github.action_path }}/src/cli.ts" index-code "${{ inputs.code-path }}"

    - name: Verify pinned claims
      id: verify
      shell: bash
      env:
        CHAMBER_DB: ${{ inputs.database }}
      # verify exits non-zero when any belief lost verified support (broken
      # OR degraded) — that exit code IS the gate; nothing here softens it.
      # The JSON is captured first so the report reaches $GITHUB_OUTPUT even
      # on a red run (delimiter form because the JSON is multi-line).
      run: |
        set -o pipefail
        rc=0
        report="$(node --experimental-strip-types "${{ github.action_path }}/src/cli.ts" verify --json)" || rc=$?
        echo "report<<CHAMBER_EOF" >> "$GITHUB_OUTPUT"
        echo "$report" >> "$GITHUB_OUTPUT"
        echo "CHAMBER_EOF" >> "$GITHUB_OUTPUT"
        echo "$report"
        exit "$rc"
